skip_local_validator = true

[toolchain]

[features]
resolution = true
skip-lint = false

[programs.localnet]
alloy_curve = "9brEDkea42QTp3dGT7jMWLE7pgnttHo5ZmyWDDPkzrbb"

[programs.devnet]
alloy_curve = "9brEDkea42QTp3dGT7jMWLE7pgnttHo5ZmyWDDPkzrbb"

[provider]
# Devnet: current plan is demo/launch on devnet first (test SOL, no real funds at risk), so
# `anchor deploy`/`anchor run` target it by default. Override with --provider.cluster for a
# local-validator session.
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "cargo test"

[hooks]
